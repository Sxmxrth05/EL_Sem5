[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upi-stepup"
version = "0.1.0"
description = "Adaptive step-up authentication for UPI-style payments: simulator, policy engine, evaluation and decision service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "matplotlib>=3.8,<4",
    "pyyaml>=6.0,<7",
    "pydantic>=2.5,<3",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.5,<1",
    "httpx>=0.27,<1",
]
ml = [
    "scikit-learn>=1.4,<2",
    "cma>=3.3,<5",
]

[tool.setuptools.packages.find]
include = ["common*", "sim*", "policy*", "baselines*", "eval*", "service*", "tools*"]

[tool.setuptools.package-data]
service = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reference", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
