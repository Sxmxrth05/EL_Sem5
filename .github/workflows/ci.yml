name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Node runs tools/run_reference.js for the JS parity check.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest (unit, API, golden and parity)
        run: pytest -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint and type-check
        run: |
          npx eslint src
          npx tsc -b

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t upi-stepup:ci .

      - name: Run and smoke-test the service
        run: |
          docker run -d --name upi -p 8000:8000 upi-stepup:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/health
          curl -fsS -X POST http://localhost:8000/score -H 'Content-Type: application/json' \
            -d '{"amount":45000,"median":250,"network":"home","new_device":false,"new_payee":true,"velocity":false,"sim_change":false,"remote":true,"far_location":false,"fri":0}' \
            | tee /tmp/score.json
          grep -q '"score":70' /tmp/score.json
          curl -fsS http://localhost:8000/ui/ | grep -q "Step-up simulation engine"

      - name: Logs on failure
        if: failure()
        run: docker logs upi
